name: tests

on:
  push:
    paths-ignore:
      - 'worker-logs/**'
      - 'WORKER_HANDOFF.md'
  pull_request:
    paths-ignore:
      - 'worker-logs/**'
      - 'WORKER_HANDOFF.md'

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python modules
        run: python -m compileall -q emberlane tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
